# D2 - AMLworld HI-Small. Manuscript Table 1 / Table 2.
extends: base.yaml

dataset:
  id: D2
  role: primary
  raw_root: datasets/raw/D2
  graph: true

split:
  train_fraction: 0.60
  validation_fraction: 0.20

preprocess:
  numeric_scaling: log1p_per_currency
  categorical_encoding: onehot_plus_hash
  hash_buckets: 1024
  temporal_window_hours: 24

stage0:
  enabled: true

stage1:
  threshold_low: 0.15
  threshold_high: 0.85

